services:
  mongo:
    image: mongo:8.2.5
    container_name: mongodb
    platform: linux/amd64
    ports:
      - "27007:27017"
    volumes:
      - mongodata:/data/db

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    networks:
      - backend
    restart: always

networks:
  backend:

volumes:
  mongodata: